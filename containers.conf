[containers]
# libkrunfw guest kernel lacks bridge/netfilter; default every container to the
# microVM's own netns instead of netavark's bridge. (host = the microVM, not the real host.)
netns = "host"

[engine]
# No systemd/dbus runs inside the microVM guest, so the systemd cgroup manager can't be used.
cgroup_manager = "cgroupfs"
# journald isn't available in the guest either.
events_logger = "file"
